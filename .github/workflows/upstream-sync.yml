name: Upstream sync

# Weekly look at genspark-ai/genoffice. Opens or refreshes one issue when new
# commits are past tools/upstream-synced-through.txt. It does not merge.

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch genspark-ai/genoffice
        run: |
          git remote add upstream https://github.com/genspark-ai/genoffice.git
          git fetch --no-tags upstream main

      - name: Compare with the last reviewed upstream commit
        id: compare
        run: |
          set +e
          node tools/upstream-sync-report.mjs --upstream upstream/main --out /tmp/upstream-sync.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs"
            const report = JSON.parse(readFileSync("/tmp/upstream-sync.json", "utf8"))
            const out = process.env.GITHUB_OUTPUT
            appendFileSync(out, `pending=${report.pending.length}\n`)
            appendFileSync(out, `marker=${report.marker}\n`)
            appendFileSync(out, `upstream_tip=${report.upstreamTip}\n`)
            // The run page always carries the report, even if the issue step below cannot write.
            if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, report.markdown)
          '

      - name: Open or update the tracking issue
        if: steps.compare.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          PENDING: ${{ steps.compare.outputs.pending }}
          MARKER: ${{ steps.compare.outputs.marker }}
          UPSTREAM_TIP: ${{ steps.compare.outputs.upstream_tip }}
        run: |
          title="Upstream sync: ${PENDING} commits on genspark-ai/genoffice since ${MARKER:0:10}"
          body="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("/tmp/upstream-sync.json","utf8")).markdown)')"
          # gh issue create/edit/comment use GraphQL (createIssue / updateIssue / addComment).
          # GITHUB_TOKEN in Actions returns "Resource not accessible by integration" for those
          # mutations even with issues: write. The REST issue routes accept that permission.
          # The report is already in the job summary, so warn instead of failing the scheduled run.
          warn() {
            echo "::warning title=Upstream sync::Could not $1 the tracking issue with GITHUB_TOKEN. The report is in this run's job summary. Check Settings > Actions > General > Workflow permissions."
          }
          # List open issues over REST and keep the first number whose title starts with "Upstream sync:".
          # Pull requests share this endpoint, so skip anything with a pull_request object.
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null and (.title | startswith("Upstream sync:"))) | .number')" || { warn read; exit 0; }
          existing="${existing%%$'\n'*}"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${existing}" -f title="$title" -f body="$body" || { warn update; exit 0; }
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" -f body="Refreshed against upstream \`${UPSTREAM_TIP}\`. ${PENDING} commits still need a review." || warn comment
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" -f title="$title" -f body="$body" || warn create
          fi
